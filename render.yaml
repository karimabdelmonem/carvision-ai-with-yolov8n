services:
  - type: web
    name: carscan-ai
    runtime: python
    plan: free
    region: frankfurt          # أقرب region لمصر (أو غيّرها حسب رغبتك)
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # App
      - key: APP_NAME
        value: CarScan API
      - key: DEBUG
        value: "false"

      # Supabase (sync: false = هنكتبهم في Render Dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: car-images

      # Model
      - key: MODEL_PATH
        value: models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: IOU_THRESHOLD
        value: "0.45"
      - key: MAX_IMAGE_SIZE_MB
        value: "10"